<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Wordle</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main>

  <h1>Wordle</h1>

  <p class="sub">
    Találd ki az 5 betűs szót 6 próbálkozásból
  </p>

  <div id="board">

    
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>

    
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>

   
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>

    
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>

    
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>

    
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>

  </div>

  <div id="msg"></div>

  <div id="keyboard">

    <div class="row">
      <button class="key">Q</button>
      <button class="key">W</button>
      <button class="key">E</button>
      <button class="key">R</button>
      <button class="key">T</button>
      <button class="key">Z</button>
      <button class="key">U</button>
      <button class="key">I</button>
      <button class="key">O</button>
      <button class="key">P</button>
      <button class="key">Ő</button>
      <button class="key">Ú</button>
    </div>

    <div class="row">
      <button class="key">A</button>
      <button class="key">S</button>
      <button class="key">D</button>
      <button class="key">F</button>
      <button class="key">G</button>
      <button class="key">H</button>
      <button class="key">J</button>
      <button class="key">K</button>
      <button class="key">L</button>
      <button class="key">É</button>
      <button class="key">Á</button>
      <button class="key">Ű</button>
    </div>

    <div class="row">
      <button class="key">Í</button>
      <button class="key">Y</button>
      <button class="key">X</button>
      <button class="key">C</button>
      <button class="key">V</button>
      <button class="key">B</button>
      <button class="key">N</button>
      <button class="key">M</button>
      <button class="key">Ó</button>
      <button class="key">Ö</button>
      <button class="key">Ü</button>
      <button class="key wide">⌫</button>
      <button class="key wide">ENTER</button>
    </div>

  </div>

  <button id="new">
    Új játék
  </button>

</main>
  
<script src="script.js"></script>
</body>
</html>
